<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A bilingual personal travel journal with photographs and reflections."
    />
    <meta name="theme-color" content="#0b2a35" />
    <title>Journey — Wander Atlas</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230b2a35'/%3E%3Ccircle cx='32' cy='32' r='18' fill='none' stroke='%23f4eee2' stroke-width='3'/%3E%3Cpath d='m39 22-4 13-13 7 7-13z' fill='%23ff6b4a'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="assets/css/styles.css?v=2" />
    <script src="assets/js/travel-data.js?v=2" defer></script>
    <script src="assets/js/journey.js?v=2" defer></script>
  </head>

  <body class="journey-page">
    <a class="skip-link" href="#journey-content">Skip to the journal</a>

    <header class="journal-header">
      <a class="back-link" href="index.html">
        <svg aria-hidden="true"><use href="#icon-arrow-left"></use></svg>
        <span data-i18n="backToMap">Back to the map</span>
      </a>

      <a class="brand brand-compact" href="index.html" aria-label="Wander Atlas home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32"><use href="#icon-compass"></use></svg>
        </span>
        <strong data-site-title>Wander Atlas</strong>
      </a>

      <div class="language-switch language-switch-dark" role="group" aria-label="Language">
        <button class="language-button is-active" type="button" data-language="en" aria-pressed="true">EN</button>
        <button class="language-button" type="button" data-language="zh" aria-pressed="false">中文</button>
      </div>
    </header>

    <main id="journey-content">
      <div class="page-loading" role="status">
        <span class="loading-orbit" aria-hidden="true"></span>
        <span>Opening the journal…</span>
      </div>
    </main>

    <dialog class="lightbox" id="lightbox" aria-label="Photo viewer">
      <button class="lightbox-close" type="button" data-lightbox-close aria-label="Close image">
        <svg aria-hidden="true"><use href="#icon-close"></use></svg>
      </button>
      <button class="lightbox-nav lightbox-prev" type="button" data-lightbox-prev aria-label="Previous image">
        <svg aria-hidden="true"><use href="#icon-chevron-left"></use></svg>
      </button>
      <figure>
        <img id="lightbox-image" src="" alt="" />
        <figcaption id="lightbox-caption"></figcaption>
      </figure>
      <button class="lightbox-nav lightbox-next" type="button" data-lightbox-next aria-label="Next image">
        <svg aria-hidden="true"><use href="#icon-chevron-right"></use></svg>
      </button>
    </dialog>

    <svg class="icon-sprite" aria-hidden="true">
      <symbol id="icon-compass" viewBox="0 0 32 32">
        <circle cx="16" cy="16" r="12.5" fill="none" stroke="currentColor" stroke-width="1.7" />
        <path d="m21.5 10.5-3.3 8-7.7 3 3.2-7.8z" fill="currentColor" />
      </symbol>
      <symbol id="icon-arrow-left" viewBox="0 0 24 24">
        <path d="M19 12H5M10 7l-5 5 5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      </symbol>
      <symbol id="icon-arrow" viewBox="0 0 24 24">
        <path d="M5 12h14M14 7l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      </symbol>
      <symbol id="icon-close" viewBox="0 0 24 24">
        <path d="m6 6 12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
      </symbol>
      <symbol id="icon-chevron-left" viewBox="0 0 24 24">
        <path d="m15 6-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      </symbol>
      <symbol id="icon-chevron-right" viewBox="0 0 24 24">
        <path d="m9 6 6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      </symbol>
      <symbol id="icon-calendar" viewBox="0 0 24 24">
        <path d="M6 3v3M18 3v3M4 9h16M5 5h14a1 1 0 0 1 1 1v14H4V6a1 1 0 0 1 1-1Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
      </symbol>
      <symbol id="icon-pin" viewBox="0 0 24 24">
        <path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" />
        <circle cx="12" cy="10" r="2.5" fill="none" stroke="currentColor" stroke-width="1.7" />
      </symbol>
      <symbol id="icon-spark" viewBox="0 0 24 24">
        <path d="m12 3 1.5 5.2L19 10l-5.5 1.8L12 17l-1.5-5.2L5 10l5.5-1.8z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
      </symbol>
    </svg>
  </body>
</html>
